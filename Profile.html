<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/profile_improved.css" />
  </head>
  <body>
    <div class="Main animate-on-scroll">
      <div class="Title">
        <h2>プロフィール</h2>
      </div>
      <div class="Menu">
        <p><a href="index.html">Top</a></p>
      </div>
    </div>

    <div class="ContentWrapper">
      <div class="ProfileCard animate-on-scroll">
        <div class="ProfileHeader">
          <div class="ProfileIcon">
             <!-- Placeholder for icon if needed, or just name -->
             <img src="photo/icon.webp" alt="Icon" class="circle-image-small">
          </div>
          <div class="ProfileName">
            <h3>平尾 海翔</h3>
            <p class="sub-text">Hirao Kaito</p>
            <p class="role-text">ゲームエンジニア学科 サーバーエンジニア専攻 2年</p>
          </div>
        </div>

        <div class="ProfileSection">
          <h3 class="SectionTitle">基本情報</h3>
          <div class="InfoGrid">
            <div class="InfoItem">
              <span class="Label">生年月日</span>
              <span class="Value">2005年10月18日 (てんびん座 / 酉年)</span>
            </div>
            <div class="InfoItem">
              <span class="Label">血液型</span>
              <span class="Value">B型</span>
            </div>
            <div class="InfoItem">
              <span class="Label">学歴</span>
              <span class="Value">
                琴似工業高等学校 卒業<br>
                専門学校北海道サイバークリエイターズ大学校  在学
              </span>
            </div>
          </div>
        </div>

        <div class="ProfileSection">
          <h3 class="SectionTitle">スキル・経験</h3>
          <div class="SkillGrid">
            <div class="SkillItem">
              <span class="SkillName">Java</span>
              <span class="SkillLevel">Mod作成</span>
            </div>
            <div class="SkillItem">
              <span class="SkillName">C#</span>
              <span class="SkillLevel">Unityゲーム作成</span>
            </div>
            <div class="SkillItem">
              <span class="SkillName">HTML/CSS</span>
              <span class="SkillLevel">Portfolio作成</span>
            </div>
            <div class="SkillItem">
              <span class="SkillName">JavaScript</span>
              <span class="SkillLevel">ブラウザゲーム</span>
            </div>
            <div class="SkillItem">
              <span class="SkillName">PHP</span>
              <span class="SkillLevel">初心者</span>
            </div>
            <div class="SkillItem">
              <span class="SkillName">Lua</span>
              <span class="SkillLevel">スクリプト制御</span>
            </div>
          </div>
        </div>

        <div class="ProfileSection">
          <h3 class="SectionTitle">取得資格</h3>
          <ul class="QualificationList">
            <li>危険物取扱者 乙4</li>
            <li>計算技術検定 3級</li>
          </ul>
        </div>
      </div>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
